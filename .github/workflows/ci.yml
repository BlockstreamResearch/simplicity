name: CI

on: [push, pull_request]

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: codespell-project/actions-codespell@v2
        with:
            ignore_words_file: spelling.ignore.txt
            skip: alectryon
  build:
    strategy:
      fail-fast: false
      matrix:
        project: ["c", "cmake", "haskell"] # coq takes a very long time and times out at 6 hours...
        os: ["ubuntu-latest", macos-latest]
        channel: ["nixos-25.05", "nixpkgs-unstable"]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Update channel ${{matrix.channel}}
        run: |
          nix-channel --add https://nixos.org/channels/${{matrix.channel}} nixpkgs
          nix-channel --update
      - run: nix-build -A ${{matrix.project}}
